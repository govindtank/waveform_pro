<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="wavePlayed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="waveUnplayed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="phoneShadow"><feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- Left: Phone Device Mockup -->
  <g transform="translate(40, 25)">
    <!-- Device frame -->
    <rect x="0" y="0" width="340" height="450" rx="32" fill="#0b0f19" filter="url(#phoneShadow)"/>
    <rect x="4" y="4" width="332" height="442" rx="28" fill="url(#bg)"/>

    <!-- Dynamic island -->
    <rect x="120" y="12" width="100" height="18" rx="9" fill="#000000"/>

    <!-- Top bar -->
    <text x="24" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">9:41</text>
    <text x="310" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">5G  100%</text>

    <!-- App title -->
    <text x="170" y="58" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Studio Audio Waveform</text>
    <text x="170" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">SoundCloud Discrete Bars Mode</text>

    <!-- Waveform card -->
    <rect x="16" y="90" width="308" height="150" rx="16" fill="#090d16" stroke="#334155" stroke-width="1"/>

    <!-- Highlight Region (selection) -->
    <rect x="110" y="90" width="90" height="150" fill="rgba(56, 189, 248, 0.12)"/>
    <line x1="110" y1="90" x2="110" y2="240" stroke="#38bdf8" stroke-width="2"/>
    <line x1="200" y1="90" x2="200" y2="240" stroke="#38bdf8" stroke-width="2"/>

    <!-- Center guide -->
    <line x1="16" y1="165" x2="324" y2="165" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Waveform Bars (RenderMode.bars) -->
    <!-- Played Section (0 -> 140px) -->
    <g fill="url(#wavePlayed)">
      <rect x="28" y="153" width="3" height="24" rx="1.5"/>
      <rect x="34" y="145" width="3" height="40" rx="1.5"/>
      <rect x="40" y="135" width="3" height="60" rx="1.5"/>
      <rect x="46" y="148" width="3" height="34" rx="1.5"/>
      <rect x="52" y="130" width="3" height="70" rx="1.5"/>
      <rect x="58" y="125" width="3" height="80" rx="1.5"/>
      <rect x="64" y="140" width="3" height="50" rx="1.5"/>
      <rect x="70" y="120" width="3" height="90" rx="1.5"/>
      <rect x="76" y="115" width="3" height="100" rx="1.5"/>
      <rect x="82" y="130" width="3" height="70" rx="1.5"/>
      <rect x="88" y="142" width="3" height="46" rx="1.5"/>
      <rect x="94" y="128" width="3" height="74" rx="1.5"/>
      <rect x="100" y="122" width="3" height="86" rx="1.5"/>
      <rect x="106" y="118" width="3" height="94" rx="1.5"/>
      <rect x="112" y="132" width="3" height="66" rx="1.5"/>
      <rect x="118" y="125" width="3" height="80" rx="1.5"/>
      <rect x="124" y="110" width="3" height="110" rx="1.5"/>
      <rect x="130" y="135" width="3" height="60" rx="1.5"/>
      <rect x="136" y="120" width="3" height="90" rx="1.5"/>
    </g>

    <!-- Playhead Scrub Line -->
    <line x1="142" y1="90" x2="142" y2="240" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="137,90 147,90 142,98" fill="#f43f5e"/>

    <!-- Unplayed Section (144 -> 312px) -->
    <g fill="url(#waveUnplayed)">
      <rect x="144" y="128" width="3" height="74" rx="1.5"/>
      <rect x="150" y="140" width="3" height="50" rx="1.5"/>
      <rect x="156" y="122" width="3" height="86" rx="1.5"/>
      <rect x="162" y="116" width="3" height="98" rx="1.5"/>
      <rect x="168" y="130" width="3" height="70" rx="1.5"/>
      <rect x="174" y="125" width="3" height="80" rx="1.5"/>
      <rect x="180" y="135" width="3" height="60" rx="1.5"/>
      <rect x="186" y="145" width="3" height="40" rx="1.5"/>
      <rect x="192" y="130" width="3" height="70" rx="1.5"/>
      <rect x="198" y="120" width="3" height="90" rx="1.5"/>
      <rect x="204" y="115" width="3" height="100" rx="1.5"/>
      <rect x="210" y="138" width="3" height="54" rx="1.5"/>
      <rect x="216" y="148" width="3" height="34" rx="1.5"/>
      <rect x="222" y="128" width="3" height="74" rx="1.5"/>
      <rect x="228" y="120" width="3" height="90" rx="1.5"/>
      <rect x="234" y="132" width="3" height="66" rx="1.5"/>
      <rect x="240" y="142" width="3" height="46" rx="1.5"/>
      <rect x="246" y="125" width="3" height="80" rx="1.5"/>
      <rect x="252" y="118" width="3" height="94" rx="1.5"/>
      <rect x="258" y="130" width="3" height="70" rx="1.5"/>
      <rect x="264" y="145" width="3" height="40" rx="1.5"/>
      <rect x="270" y="135" width="3" height="60" rx="1.5"/>
      <rect x="276" y="150" width="3" height="30" rx="1.5"/>
      <rect x="282" y="140" width="3" height="50" rx="1.5"/>
      <rect x="288" y="155" width="3" height="20" rx="1.5"/>
      <rect x="294" y="148" width="3" height="34" rx="1.5"/>
      <rect x="300" y="158" width="3" height="14" rx="1.5"/>
    </g>

    <!-- Cue Marker Badge -->
    <rect x="100" y="96" width="46" height="16" rx="4" fill="#f59e0b"/>
    <text x="123" y="108" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Intro</text>

    <!-- Time Ruler -->
    <line x1="16" y1="240" x2="324" y2="240" stroke="#334155"/>
    <g font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">
      <text x="28" y="254">0:00</text>
      <text x="96" y="254">0:05</text>
      <text x="166" y="254">0:10</text>
      <text x="236" y="254">0:15</text>
      <text x="304" y="254">0:20</text>
    </g>

    <!-- Audio Player Controls -->
    <g transform="translate(16, 275)">
      <!-- Progress time -->
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">0:08.4</text>
      <text x="308" y="14" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0:20.0</text>

      <!-- Action buttons -->
      <circle cx="154" cy="50" r="24" fill="#38bdf8"/>
      <polygon points="149,40 163,50 149,60" fill="#0f172a"/>

      <circle cx="84" cy="50" r="16" fill="#1e293b"/>
      <text x="84" y="54" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">⏮ 5s</text>

      <circle cx="224" cy="50" r="16" fill="#1e293b"/>
      <text x="224" y="54" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">5s ⏭</text>

      <!-- Mode selection chips -->
      <rect x="14" y="90" width="80" height="24" rx="12" fill="#38bdf8"/>
      <text x="54" y="106" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">Bars (Active)</text>

      <rect x="104" y="90" width="90" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="149" y="106" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Curved Spline</text>

      <rect x="204" y="90" width="80" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="244" y="106" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Continuous</text>
    </g>

    <!-- Home bar -->
    <rect x="120" y="434" width="100" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Right: Feature Overview & Live Specs -->
  <g transform="translate(420, 40)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#0f172a">waveform_pro</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">Production-Quality Audio Waveform Engine</text>

    <!-- Feature list card -->
    <g transform="translate(0, 80)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#e0f2fe"/>
        <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">✓</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Discrete Bar, Continuous &amp; Bezier Spline Modes</text>
      </g>

      <g transform="translate(0, 32)">
        <circle cx="10" cy="10" r="10" fill="#e0f2fe"/>
        <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">✓</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Dual-Color Played vs Unplayed Progress Shader</text>
      </g>

      <g transform="translate(0, 64)">
        <circle cx="10" cy="10" r="10" fill="#e0f2fe"/>
        <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">✓</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">GPU-Accelerated Multi-Resolution Pyramid Cache</text>
      </g>

      <g transform="translate(0, 96)">
        <circle cx="10" cy="10" r="10" fill="#e0f2fe"/>
        <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">✓</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Draggable Regions, Cue Markers &amp; Adaptive Ruler</text>
      </g>

      <g transform="translate(0, 128)">
        <circle cx="10" cy="10" r="10" fill="#e0f2fe"/>
        <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">✓</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Live Recording Buffer &amp; Headless PNG Exporter</text>
      </g>
    </g>

    <!-- Code Preview Card -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="340" height="110" rx="10" fill="#0f172a"/>
      <text x="16" y="24" font-family="Consolas, Monaco, monospace" font-size="11" fill="#38bdf8">WaveformTimeline(</text>
      <text x="16" y="44" font-family="Consolas, Monaco, monospace" font-size="11" fill="#e2e8f0">  data: audioPeaks,</text>
      <text x="16" y="64" font-family="Consolas, Monaco, monospace" font-size="11" fill="#e2e8f0">  style: WaveformStyle.voiceMemo,</text>
      <text x="16" y="84" font-family="Consolas, Monaco, monospace" font-size="11" fill="#e2e8f0">  playheadPosition: currentSeconds,</text>
      <text x="16" y="100" font-family="Consolas, Monaco, monospace" font-size="11" fill="#38bdf8">)</text>
    </g>
  </g>
</svg>
