<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#f0f0f0"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1565C0"/><stop offset="100%" stop-color="#42A5F5"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.15"/></filter>
    <filter id="phoneShadow"><feDropShadow dx="0" dy="8" stdDeviation="24" flood-opacity="0.25"/></filter>
    <clipPath id="phoneClip"><rect x="40" y="20" width="360" height="740" rx="32"/></clipPath>
  </defs>

  <!-- Phone frame -->
  <rect x="40" y="20" width="360" height="740" rx="36" fill="#1a1a2e" filter="url(#phoneShadow)"/>
  <rect x="48" y="28" width="344" height="724" rx="30" fill="url(#bg)"/>
  <!-- Notch -->
  <rect x="180" y="36" width="80" height="20" rx="10" fill="#1a1a2e"/>

  <!-- Status bar -->
  <text x="62" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#666">9:41</text>
  <text x="350" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#666" text-anchor="end">📶 🔋 97%</text>

  <!-- Header -->
  <text x="228" y="90" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#222" text-anchor="middle">waveform_pro</text>
  <rect x="290" y="78" width="50" height="18" rx="9" fill="#E8F5E9"/>
  <text x="315" y="91" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#2E7D32" text-anchor="middle">● Live</text>

  <text x="68" y="120" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#333">Voice Recording</text>

  <!-- Waveform Container -->
  <rect x="58" y="130" width="324" height="148" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Region highlight -->
  <rect x="148" y="130" width="110" height="148" fill="rgba(33,150,243,0.1)"/>
  <line x1="148" y1="130" x2="148" y2="278" stroke="rgba(33,150,243,0.3)" stroke-width="2"/>
  <line x1="258" y1="130" x2="258" y2="278" stroke="rgba(33,150,243,0.3)" stroke-width="2"/>

  <!-- Center line -->
  <line x1="58" y1="204" x2="382" y2="204" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>

  <!-- Cue marker: Intro -->
