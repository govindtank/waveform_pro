  <!-- Mirror path -->
  <path d="M58,204 L64,224 L68,216 L72,233 L76,218 L80,243 L84,226 L88,234 L92,246 L96,230 L100,238 L104,222 L108,232 L112,248 L116,230 L120,236 L124,226 L128,240 L132,232 L136,238 L140,250 L144,228 L148,236 L152,226 L156,240 L160,222 L164,234 L168,228 L172,244 L176,224 L180,236 L184,230 L188,246 L192,222 L196,234 L200,228 L204,240 L208,224 L212,236 L216,230 L220,246 L224,222 L228,234 L232,226 L236,240 L240,224 L244,238 L248,230 L252,244 L256,222 L260,236 L264,228 L268,240 L272,224 L276,234 L280,230 L284,246 L288,222 L292,236 L296,228 L300,242 L304,226 L308,234 L312,230 L316,246 L320,222 L324,236 L328,226 L332,240 L336,224 L340,236 L344,228 L348,244 L352,222 L356,234 L360,230 L364,242 L368,226 L372,232 L376,226 L380,240 L382,236" fill="none" stroke="url(#wave)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Time ruler -->
  <line x1="58" y1="278" x2="382" y2="278" stroke="#e0e0e0"/>
  <g font-family="system-ui,sans-serif" font-size="8" fill="#999">
    <line x1="67" y1="278" x2="67" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="67" y="295">0.0</text>
    <line x1="100" y1="278" x2="100" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="100" y="295">2.0</text>
    <line x1="133" y1="278" x2="133" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="133" y="295">4.0</text>
    <line x1="166" y1="278" x2="166" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="166" y="295">6.0</text>
    <line x1="199" y1="278" x2="199" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="199" y="295">8.0</text>
    <line x1="232" y1="278" x2="232" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="232" y="295">10.0</text>
    <line x1="265" y1="278" x2="265" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="265" y="295">12.0</text>
    <line x1="298" y1="278" x2="298" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="298" y="295">14.0</text>
    <line x1="331" y1="278" x2="331" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="331" y="295">16.0</text>
    <line x1="364" y1="278" x2="364" y2="286" stroke="#ccc" stroke-width="0.5"/><text x="364" y="295">18.0</text>
  </g>

  <!-- Zoom controls -->
  <g transform="translate(130, 310)">
    <circle cx="20" cy="12" r="16" fill="#f0f0f0"/><text x="20" y="16" font-size="14" fill="#555" text-anchor="middle" font-weight="600">−</text>
    <text x="70" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#888" text-anchor="middle">1.0 px/sample</text>
    <circle cx="120" cy="12" r="16" fill="#f0f0f0"/><text x="120" y="16" font-size="14" fill="#555" text-anchor="middle" font-weight="600">+</text>
    <text x="155" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#1976D2" font-weight="600">Fit</text>
  </g>

  <!-- Feature badges -->
  <rect x="68" y="345" width="130" height="20" rx="10" fill="#E3F2FD"/>
  <text x="133" y="359" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1565C0" text-anchor="middle">✅ Voice Recording (30s)</text>
  <rect x="206" y="345" width="120" height="20" rx="10" fill="#f0f0f0"/>
  <text x="266" y="359" font-family="system-ui,sans-serif" font-size="9" fill="#666" text-anchor="middle">🎵 Music Track</text>

  <!-- Demo buttons -->
  <text x="68" y="390" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#333">Selection Region</text>
  <rect x="68" y="398" width="120" height="32" rx="16" fill="#1976D2"/>
  <text x="128" y="418" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Select 10-20s</text>
  <rect x="198" y="398" width="80" height="32" rx="16" fill="none" stroke="#1976D2" stroke-width="1.5"/>
  <text x="238" y="418" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1976D2" text-anchor="middle">Clear</text>

  <text x="68" y="450" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#333">Cue Markers</text>
  <rect x="68" y="458" width="115" height="32" rx="16" fill="#1976D2"/>
  <text x="125" y="478" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Marker at 25%</text>
  <rect x="193" y="458" width="115" height="32" rx="16" fill="#1976D2"/>
  <text x="250" y="478" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Marker at 75%</text>

  <!-- Info card -->
  <rect x="58" y="500" width="324" height="100" rx="12" fill="#f8f9fa" filter="url(#shadow)"/>
  <text x="78" y="520" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#333">Interactive Features</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#555">
    <text x="78" y="540">🤏  Pinch to zoom in/out</text>
    <text x="78" y="556">👉  Swipe to scroll horizontally</text>
    <text x="78" y="572">👆  Tap to seek to a position</text>
    <text x="78" y="588">📌  Long-press to add a cue marker</text>
    <text x="220" y="588">🔍  Zoom controls below waveform</text>
  </g>

  <!-- Labels -->
  <text x="440" y="100" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#333">waveform_pro</text>
  <text x="440" y="130" font-family="system-ui,sans-serif" font-size="16" fill="#666">Flutter Waveform Library</text>

  <g transform="translate(440, 160)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="12" font-family="system-ui,sans-serif" font-size="14" fill="#555">GPU-accelerated rendering</text>
    <rect x="0" y="24" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="36" font-family="system-ui,sans-serif" font-size="14" fill="#555">Multi-resolution pyramid cache</text>
    <rect x="0" y="48" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="60" font-family="system-ui,sans-serif" font-size="14" fill="#555">Pinch-to-zoom &amp; scroll</text>
    <rect x="0" y="72" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="84" font-family="system-ui,sans-serif" font-size="14" fill="#555">Region selection with handles</text>
    <rect x="0" y="96" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="108" font-family="system-ui,sans-serif" font-size="14" fill="#555">Cue markers with labels</text>
    <rect x="0" y="120" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="132" font-family="system-ui,sans-serif" font-size="14" fill="#555">Time ruler with adaptive ticks</text>
    <rect x="0" y="144" width="14" height="14" rx="3" fill="#4CAF50"/><text x="22" y="156" font-family="system-ui,sans-serif" font-size="14" fill="#555">WAV &amp; PCM peak extraction</text>
  </g>

  <text x="440" y="360" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#333">Quick Start</text>
  <rect x="440" y="372" width="320" height="50" rx="8" fill="#263238"/>
  <text x="454" y="392" font-family="monospace" font-size="11" fill="#E8F5E9">WaveformTimeline(</text>
  <text x="454" y="408" font-family="monospace" font-size="11" fill="#E8F5E9">  data: myWaveform, height: 140</text>
  <text x="454" y="424" font-family="monospace" font-size="11" fill="#E8F5E9">)</text>

  <text x="440" y="450" font-family="system-ui,sans-serif" font-size="12" fill="#888">github.com/govindtank/waveform_pro</text>
</svg>
