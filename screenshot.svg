  <rect x="148" y="136" width="40" height="16" rx="4" fill="#FF9800"/>
  <text x="168" y="148" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Intro</text>

  <!-- Cue marker: Outro -->
  <line x1="272" y1="138" x2="272" y2="278" stroke="#9C27B0" stroke-width="2"/>
  <rect x="260" y="136" width="44" height="16" rx="4" fill="#9C27B0"/>
  <text x="282" y="148" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Outro</text>

